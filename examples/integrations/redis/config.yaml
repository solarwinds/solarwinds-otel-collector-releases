receivers:
  redis:
    endpoint: # Required parameter
    collection_interval: # Required parameter
    # password: # Optional secret
    metrics:
      redis.clients.blocked:
        enabled: true
      redis.clients.connected:
        enabled: true
      redis.clients.max_input_buffer:
        enabled: true
      redis.clients.max_output_buffer:
        enabled: true
      redis.commands:
        enabled: true
      redis.commands.processed:
        enabled: true
      redis.connections.received:
        enabled: true
      redis.connections.rejected:
        enabled: true
      redis.cpu.time:
        enabled: true
      redis.db.avg_ttl:
        enabled: true
      redis.db.expires:
        enabled: true
      redis.db.keys:
        enabled: true
      redis.keys.evicted:
        enabled: true
      redis.keys.expired:
        enabled: true
      redis.keyspace.hits:
        enabled: true
      redis.keyspace.misses:
        enabled: true
      redis.latest_fork:
        enabled: true
      redis.memory.fragmentation_ratio:
        enabled: true
      redis.memory.lua:
        enabled: true
      redis.memory.peak:
        enabled: true
      redis.memory.rss:
        enabled: true
      redis.memory.used:
        enabled: true
      redis.net.input:
        enabled: true
      redis.net.output:
        enabled: true
      redis.rdb.changes_since_last_save:
        enabled: true
      redis.replication.backlog_first_byte_offset:
        enabled: true
      redis.replication.offset:
        enabled: true
      redis.slaves.connected:
        enabled: true
      redis.uptime:
        enabled: true
      redis.role:
        enabled: true
  # Optional receiver
  # file_log:
  #   include: # Required parameter
  #   start_at: end
  #   poll_interval: 5s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 50
    spike_limit_percentage: 30
  solarwinds/redis:
    collector_attributes_decoration:
      enabled: true
      extension: solarwinds
    resource:
      sw.otelcol.receiver.name: "redis"
      sw.otelcol.integration.id: # Required parameter
  resource_detection/ec2:
    detectors: ["ec2"]
    timeout: 2s
    override: true
  resource_detection/azure:
    detectors: ["azure"]
    timeout: 2s
    override: true
  resource_detection/gcp:
    detectors: ["gcp"]
    timeout: 2s
    override: true
  resource_detection/system:
    detectors: ["system"]
    timeout: 2s
    override: false
    system:
      hostname_sources: ["os"]
  batch:
    send_batch_max_size: 20000

extensions:
  solarwinds:
    collector_name: # Required parameter
    grpc: &grpc_settings
      endpoint: # Required parameter
      tls:
        insecure: false
      headers: {"Authorization": "Bearer ${env:SOLARWINDS_TOKEN}", "swi-reporter": "dbo solarwinds-otel-collector"}

exporters:
  otlp_grpc:
    <<: *grpc_settings

service:
  extensions:
    - solarwinds
  pipelines:
    metrics/redis:
      receivers:
        - redis
      processors:
        - memory_limiter
        - resource_detection/ec2
        - resource_detection/azure
        - resource_detection/gcp
        - resource_detection/system
        - batch
        - solarwinds/redis
      exporters:
        - otlp_grpc

    # Optional pipeline
    # logs/redis:
    #   receivers:
    #     - file_log
    #   processors:
    #     - memory_limiter
    #     - resource_detection/ec2
    #     - resource_detection/azure
    #     - resource_detection/gcp
    #     - resource_detection/system
    #     - batch
    #     - solarwinds/redis
    #   exporters:
    #     - otlp_grpc
