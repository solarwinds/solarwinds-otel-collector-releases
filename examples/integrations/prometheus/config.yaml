receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'prometheus'
          scrape_interval: # Required parameter
          static_configs:
            - targets: # Required parameter

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 50
    spike_limit_percentage: 30
  solarwinds/prometheus:
    collector_attributes_decoration:
      enabled: true
      extension: solarwinds
    resource:
      sw.otelcol.receiver.name: "prometheus"
      sw.otelcol.integration.id: # Required parameter
  resource_detection/ec2:
    detectors: ["ec2"]
    timeout: 2s
    override: true
  resource_detection/azure:
    detectors: ["azure"]
    timeout: 2s
    override: true
  resource_detection/gcp:
    detectors: ["gcp"]
    timeout: 2s
    override: true
  resource_detection/system:
    detectors: ["system"]
    timeout: 2s
    override: false
    system:
      hostname_sources: ["os"]
  batch:
    send_batch_max_size: 20000

extensions:
  solarwinds:
    collector_name: # Required parameter
    grpc: &grpc_settings
      endpoint: # Required parameter
      tls:
        insecure: false
      headers: {"Authorization": "Bearer ${env:SOLARWINDS_TOKEN}", "swi-reporter": "otel solarwinds-otel-collector"}

exporters:
  otlp_grpc:
    <<: *grpc_settings

service:
  extensions:
    - solarwinds
  pipelines:
    metrics/prometheus:
      receivers:
        - prometheus
      processors:
        - memory_limiter
        - resource_detection/ec2
        - resource_detection/azure
        - resource_detection/gcp
        - resource_detection/system
        - batch
        - solarwinds/prometheus
      exporters:
        - otlp_grpc
