extensions:
  solarwinds:
    collector_name: # Required parameter
    grpc: &grpc_settings
      endpoint: # Required parameter
      tls:
        insecure: false
      headers: {"Authorization": "Bearer ${env:SOLARWINDS_TOKEN}", "swi-reporter": "otel solarwinds-otel-collector"}

exporters:
  otlp_grpc:
    <<: *grpc_settings

service:
  extensions:
    - solarwinds
  pipelines:
    metrics/nvidia_dcgm:
      receivers:
        - prometheus
      processors:
        - memory_limiter
        - resource_detection/ec2
        - resource_detection/azure
        - resource_detection/gcp
        - resource_detection/system
        - transform/nvidia_dcgm
        - batch
        - solarwinds/nvidia_dcgm
      exporters:
        - otlp_grpc
